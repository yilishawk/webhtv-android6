plugins {
    id 'com.android.library'
    id 'com.chaquo.python'
}

android {
    namespace = 'com.fongmi.chaquo'

    compileSdk libs.versions.compileSdk.get().toInteger()

    defaultConfig {
        // Chaquopy 17 requires minSdk >= 24, and that is a real runtime dependency, not
        // a formality: on 32-bit ABIs libpython3.10.so is built for android-24 and
        // references lockf64 / preadv64 / pwritev64, which Android 6's bionic does not
        // export. The app keeps minSdk 23 and overrides this library's minSdk via
        // tools:overrideLibrary, which only silences the *build-time* check.
        //
        // The missing symbols are supplied at runtime by libwebhtv_shim.so
        // (app/src/main/cpp/libc_shim.c), loaded from Platform#loadLibcShim. If that
        // still fails on some device, PyLoader degrades to "no Python spiders" rather
        // than taking the whole loader down.
        minSdk 24
        targetSdk libs.versions.targetSdk.get().toInteger()
        python {
            version = "3.10"
            pip {
                install("-r", "requirements.txt")
            }
        }
    }

    flavorDimensions = ["abi"]

    productFlavors {
        arm64_v8a {
            dimension "abi"
            ndk { abiFilters "arm64-v8a" }
        }
        armeabi_v7a {
            dimension "abi"
            ndk { abiFilters "armeabi-v7a" }
        }
    }

    sourceSets {
        main {
            python.srcDirs = ["src/main/python"]
        }
    }

    compileOptions {
        coreLibraryDesugaringEnabled = true
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
}

dependencies {
    implementation project(':catvod')
    coreLibraryDesugaring libs.desugar
}